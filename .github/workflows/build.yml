name: Compiler APK et EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_ORG: com.animeorganizer
  APP_NAME: anime_organizer

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter utilisee
        run: flutter --version

      - name: Generer le dossier android
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_backup
          flutter create --org "$APP_ORG" --project-name "$APP_NAME" --platforms=android .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/lib_backup lib

      - name: Ajouter les permissions
        run: python3 tool/patch_android.py

      - name: Recuperer les dependances
        run: flutter pub get

      - name: Generer les icones
        run: dart run flutter_launcher_icons

      - name: Compiler l'APK
        run: >
          flutter build apk --release
          --build-name=1.${{ github.run_number }}.0
          --build-number=${{ github.run_number }}

      - name: Renommer l'APK
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk AnimeOrganizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeOrganizer-Android
          path: AnimeOrganizer.apk
          retention-days: 30

  windows:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter utilisee
        run: flutter --version

      - name: Generer le dossier windows
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_backup
          flutter create --org "$APP_ORG" --project-name "$APP_NAME" --platforms=windows .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/lib_backup lib

      - name: Nom de la fenetre
        shell: bash
        run: sed -i 's/L"anime_organizer"/L"Anime Organizer"/' windows/runner/main.cpp

      - name: Activer la cible Windows
        run: flutter config --enable-windows-desktop

      - name: Recuperer les dependances
        run: flutter pub get

      - name: Activer les plugins de la seconde fenêtre V50
        run: python3 tool/patch_v50_windows.py

      - name: Generer l'icone Windows
        run: dart run flutter_launcher_icons -f icons_windows.yaml

      - name: Compiler l'application
        env:
          # Visual Studio 2026 refuse <experimental/coroutine>, utilise par
          # permission_handler. Cette definition leve le blocage.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: >
          flutter build windows --release
          --build-name=1.${{ github.run_number }}.0
          --build-number=${{ github.run_number }}

      # Flutter exige ces trois DLL a cote de l'executable. Elles sont
      # presentes sur la plupart des PC grace a d'autres logiciels, mais pas
      # sur une machine neuve : l'application refuserait alors de demarrer.
      - name: Embarquer les DLL Visual C++
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (-not (Test-Path $src)) { throw "DLL introuvable sur la machine de compilation : $src" }
            Copy-Item $src $rel -Force
          }
          Get-ChildItem $rel -Filter "*140*.dll" | Format-Table Name, Length

      - name: Construire le serveur Python embarqué
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --onefile --noconsole --clean --name AnimeOrganizerSyncServer tool/sync_server.py
          Copy-Item dist/AnimeOrganizerSyncServer.exe build/windows/x64/runner/Release/AnimeOrganizerSyncServer.exe -Force
          if (-not (Test-Path build/windows/x64/runner/Release/AnimeOrganizerSyncServer.exe)) { throw 'Serveur Python absent' }

      - name: Construire l'analyseur local de génériques
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --noconsole --clean --name AnimeOrganizerCreditsDetector tool/credits_detector.py
          Copy-Item dist/AnimeOrganizerCreditsDetector.exe build/windows/x64/runner/Release/AnimeOrganizerCreditsDetector.exe -Force
          if (-not (Test-Path build/windows/x64/runner/Release/AnimeOrganizerCreditsDetector.exe)) { throw 'Analyseur absent' }

      # V31: ffmpeg est embarque dans la version Windows, pas suppose installe.
      # Le fichier extrait est le vrai executable, pas le shim Chocolatey.
      - name: Embarquer FFmpeg pour les captures F2 F3 exactes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Installation FFmpeg echouee' }
          $roots = @(
            "$env:ChocolateyInstall\lib\ffmpeg",
            'C:\tools\ffmpeg',
            'C:\ProgramData\chocolatey\lib\ffmpeg'
          ) | Where-Object { Test-Path $_ } | Select-Object -Unique
          $candidates = @($roots | ForEach-Object {
            Get-ChildItem -LiteralPath $_ -Filter ffmpeg.exe -File -Recurse -ErrorAction SilentlyContinue
          } | Where-Object { $_.Length -gt 1000000 } | Sort-Object Length -Descending)
          if ($candidates.Count -eq 0) { throw 'Vrai ffmpeg.exe introuvable apres installation' }
          $dest = 'build/windows/x64/runner/Release/ffmpeg.exe'
          Copy-Item -LiteralPath $candidates[0].FullName -Destination $dest -Force
          & $dest -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg embarque non executable' }
          Get-FileHash -Algorithm SHA256 $dest | Format-List

      - name: Compresser l'application
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath AnimeOrganizer-Windows-portable.zip

      # V37 : fonctionnalites WizardBackImageFile/WizardStyle necessitant Inno >= 6.7.
      # Version officielle fixee + verification SHA-256 : pas d'installateur opaque.
      - name: Preparer Inno Setup 6.7.3 verifie
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Empreinte Inno Setup incorrecte' }
          $dest = Join-Path $env:RUNNER_TEMP 'AnimeOrganizerInno673'
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dest" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installation Inno Setup en erreur ($($proc.ExitCode))" }
          $compiler = Join-Path $dest 'ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Compilateur ISCC.exe introuvable' }
          "ANIME_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Construire l'installateur
        shell: pwsh
        run: |
          & $env:ANIME_ISCC "/DAppVersion=1.${{ github.run_number }}.0" "installer\anime_organizer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      # V29_INDIVIDUAL_AUDIT: rapport separant signature, integrite et antivirus.
      # Si Defender est inactif, l'etat reste UNVERIFIED : jamais "sans virus".
      - name: Auditer chaque executable Windows (V29)
        shell: pwsh
        run: ./tool/audit_windows_v29.ps1

      - name: Publier le rapport de verification Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeOrganizer-Rapport-Securite-Windows
          path: security-report/
          if-no-files-found: warn
          retention-days: 30

      # Les noms finissent par -Windows : recuperer-apk.sh efface ce motif
      # avant chaque telechargement, gh refusant d'ecraser un dossier.
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeOrganizer-Installateur-Windows
          path: dist/AnimeOrganizer-Setup-*.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeOrganizer-Portable-Windows
          path: AnimeOrganizer-Windows-portable.zip
          retention-days: 30


  release:
    name: Publier les telechargements
    runs-on: ubuntu-latest
    needs: [android, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AnimeOrganizer-Android
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: AnimeOrganizer-Installateur-Windows
          path: dist/windows-installer
      - uses: actions/download-artifact@v4
        with:
          name: AnimeOrganizer-Portable-Windows
          path: dist/windows-portable
      - name: Preparer les fichiers publics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/android/AnimeOrganizer.apk release/AnimeOrganizer.apk
          find dist/windows-installer -type f -name '*.exe' -print -quit | xargs -r -I {} cp '{}' release/AnimeOrganizer-Setup.exe
          cp dist/windows-portable/AnimeOrganizer-Windows-portable.zip release/AnimeOrganizer-Windows-portable.zip
          test -s release/AnimeOrganizer.apk
          test -s release/AnimeOrganizer-Setup.exe
          test -s release/AnimeOrganizer-Windows-portable.zip
      # V27_SECURITY_REPORT: empreinte de chaque fichier effectivement publie.
      - name: Creer les empreintes SHA-256 des telechargements
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum AnimeOrganizer.apk AnimeOrganizer-Setup.exe AnimeOrganizer-Windows-portable.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publier dans GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.${{ github.run_number }}.0"
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Anime Organizer $TAG" \
            --notes "Application gratuite pour Android et Windows. Trois telechargements : APK, installateur Windows et version portable." \
            --latest
