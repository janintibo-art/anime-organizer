name: Compiler APK et EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_ORG: com.animeorganizer
  APP_NAME: anime_organizer

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter utilisee
        run: flutter --version

      - name: Generer le dossier android
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_backup
          flutter create --org "$APP_ORG" --project-name "$APP_NAME" --platforms=android .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/lib_backup lib

      - name: Ajouter les permissions
        run: python3 tool/patch_android.py

      - name: Recuperer les dependances
        run: flutter pub get

      - name: Generer les icones
        run: dart run flutter_launcher_icons

      - name: Compiler l'APK
        run: >
          flutter build apk --release
          --build-name=1.${{ github.run_number }}.0
          --build-number=${{ github.run_number }}

      - name: Renommer l'APK
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-release.apk AnimeOrganizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeOrganizer-Android
          path: AnimeOrganizer.apk
          retention-days: 30

  windows:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter utilisee
        run: flutter --version

      - name: Generer le dossier windows
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_backup
          flutter create --org "$APP_ORG" --project-name "$APP_NAME" --platforms=windows .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/lib_backup lib

      - name: Nom de la fenetre
        shell: bash
        run: sed -i 's/L"anime_organizer"/L"Anime Organizer"/' windows/runner/main.cpp

      - name: Activer la cible Windows
        run: flutter config --enable-windows-desktop

      - name: Recuperer les dependances
        run: flutter pub get

      - name: Generer l'icone Windows
        run: dart run flutter_launcher_icons -f icons_windows.yaml

      - name: Compiler l'application
        env:
          # Visual Studio 2026 refuse <experimental/coroutine>, utilise par
          # permission_handler. Cette definition leve le blocage.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: >
          flutter build windows --release
          --build-name=1.${{ github.run_number }}.0
          --build-number=${{ github.run_number }}

      # Flutter exige ces trois DLL a cote de l'executable. Elles sont
      # presentes sur la plupart des PC grace a d'autres logiciels, mais pas
      # sur une machine neuve : l'application refuserait alors de demarrer.
      - name: Embarquer les DLL Visual C++
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (-not (Test-Path $src)) { throw "DLL introuvable sur la machine de compilation : $src" }
            Copy-Item $src $rel -Force
          }
          Get-ChildItem $rel -Filter "*140*.dll" | Format-Table Name, Length

      - name: Compresser l'application
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath AnimeOrganizer-Windows-portable.zip

      # Inno Setup n'est pas garanti sur les machines GitHub : on l'installe
      # s'il manque. Chocolatey y est toujours present.
      - name: Installer Inno Setup si besoin
        shell: pwsh
        run: |
          $defaut = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path $defaut)) {
            choco install innosetup -y --no-progress
          }

      - name: Construire l'installateur
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=1.${{ github.run_number }}.0" "installer\anime_organizer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      # Les noms finissent par -Windows : recuperer-apk.sh efface ce motif
      # avant chaque telechargement, gh refusant d'ecraser un dossier.
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeOrganizer-Installateur-Windows
          path: dist/AnimeOrganizer-Setup-*.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeOrganizer-Portable-Windows
          path: AnimeOrganizer-Windows-portable.zip
          retention-days: 30
